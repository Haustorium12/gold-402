# Keeps the "New This Week" block in README.md current: two rolling lists
# (this ISO week + last), recomputed from merge history. Self-rolling -- the
# Monday roll is just the week math moving, no archive, no extra posts.
name: Weekly Additions
on:
  push:
    branches: [main]
    paths: ['directory/**', 'README.md']
  schedule:
    - cron: '30 9 * * *'      # daily backstop: handles the Monday roll + missed merges
  workflow_dispatch:
concurrency:
  group: weekly-additions
  # NOT shared with the other README writer. Tried that 2026-09-03 and it was worse:
  # with cancel-in-progress:false GitHub keeps ONE pending run per group and CANCELS
  # any further pending ones, so two pushes 20s apart cancelled readme-numbers twice
  # and left the headline count stale at 517 against 518 on the shelves. A cancelled
  # run reports no failure, which is the vault pattern. The cross-workflow race is
  # handled at the push instead -- rebase and retry, below.
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh New This Week block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly_additions.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
          else
            git config user.name "weekly-additions"
            git config user.email "actions@github.com"
            git add README.md
            git commit -m "weekly additions: refresh New This Week block"
            # README has two writers (weekly-additions, readme-numbers). They share a
            # concurrency group now, but a human merge can still land between our
            # checkout and our push. Rebase and retry rather than fail the run:
            # a non-fast-forward here is a race, not a defect in the number.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rejected (attempt $i) -- refetching"
              sleep $((i * 5))
            done
            echo "::error::could not push README after 3 rebase attempts"
            exit 1
          fi

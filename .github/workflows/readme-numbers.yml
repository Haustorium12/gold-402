# Keeps the README's entry count equal to the shelf.
#
# WHY: on 2026-08-30 the headline said "459 curated entries" against 506 on the shelves.
# Forty-seven out, on the first sentence a stranger reads. Nobody lied -- the number was
# typed by hand once and every merge after that made it a little more wrong.
#
# WHAT IT OWNS: only what sits between the fence markers in README.md. Human prose is
# never touched. See the header of scripts/readme_numbers.py for the full contract,
# including the part this deliberately does NOT do (police the CLAIMS -- no cron would
# have caught "No dead links", and that still needs a human read after every merge).
#
# FAILS CLOSED and files its own ticket. A wrong number written confidently by a machine
# is worse than a stale one, because nobody re-checks a bot -- which is exactly how the
# 24K Vault's monthly audit filed a passing report every month for four months while
# checking nothing.
name: README Numbers

on:
  push:
    branches: [main]
    paths: ['directory/**']     # a merge changed the shelf; the number follows it
  schedule:
    - cron: '45 9 * * *'        # daily backstop, 15 min after weekly-additions
  workflow_dispatch:

concurrency:
  group: readme-numbers
  # NOT shared with the other README writer. Tried that 2026-09-03 and it was worse:
  # with cancel-in-progress:false GitHub keeps ONE pending run per group and CANCELS
  # any further pending ones, so two pushes 20s apart cancelled readme-numbers twice
  # and left the headline count stale at 517 against 518 on the shelves. A cancelled
  # run reports no failure, which is the vault pattern. The cross-workflow race is
  # handled at the push instead -- rebase and retry, below.
  cancel-in-progress: false

permissions:
  contents: write               # to write the count back into README.md
  issues: write                 # to file its own ticket when it refuses to write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recount the shelves and update the README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/readme_numbers.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
          else
            git config user.name "readme-numbers"
            git config user.email "actions@github.com"
            git add README.md
            git commit -m "readme-numbers: entry count recounted from the shelves"
            # README has two writers (weekly-additions, readme-numbers). They share a
            # concurrency group now, but a human merge can still land between our
            # checkout and our push. Rebase and retry rather than fail the run:
            # a non-fast-forward here is a race, not a defect in the number.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rejected (attempt $i) -- refetching"
              sleep $((i * 5))
            done
            echo "::error::could not push README after 3 rebase attempts"
            exit 1
          fi
